# Pre-validated worker configurations for the RTX 3090 (24 GB VRAM).
#
# IMPORTANT: Only edit these values after testing VRAM usage.
# The scheduler uses exactly these parameters — no on-the-fly generation.
#
# Hardware & VRAM budget:
#   GPU: NVIDIA RTX 3090 (24 GB VRAM / 24,576 MiB)
#   Desktop baseline overhead: ~2.3-2.6 GB (niri, LM Studio, Antigravity IDE, Alacritty)
#   Target headroom: >4.5 GB free VRAM (graceful headroom, zero RAM spilling)
#   Execution policy: GPU only. No CPU fallback.
#   If a model cannot fit in GPU VRAM, a structured resource_error is returned
#   with available VRAM stats and actionable downgrade recommendations.

[worker.cheap]
# Qwen3.5-9B Q4_K_M: ~7.3 GB VRAM loaded at context_length=32768 (parallel=2)
# Uses Grouped Query Attention (GQA); total VRAM under 10 GB, leaving ~14.5 GB headroom.
lms_model_key     = "qwen/qwen3.5-9b"
context_length    = 32768
parallel          = 2
gpu_offload       = "max"
max_output_tokens = 8192
default_timeout   = 300

[worker.smart]
# Qwen3.6-27B Q4_K_M: ~16.4 GB model + KV cache loaded at context_length=32768 (parallel=1)
# Uses GQA (4 KV heads); total VRAM ~19.6 GB with desktop, leaving ~5.0 GB headroom.
# Unloads cheap model before loading. Sequential execution.
lms_model_key     = "qwen/qwen3.6-27b"
context_length    = 32768
parallel          = 1
gpu_offload       = "max"
max_output_tokens = 16384
default_timeout   = 600

[scheduler]
# Seconds to wait for additional cheap jobs before switching to smart mode.
cheap_drain_window = 5.0

# How often to poll LM Studio health (seconds).
health_check_interval = 30

# Days to retain completed/cancelled jobs in SQLite before pruning.
job_retention_days = 7
