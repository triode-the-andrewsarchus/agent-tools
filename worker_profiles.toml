# Pre-validated worker configurations for the RTX 3090 (24 GB VRAM).
#
# IMPORTANT: Only edit these values after testing VRAM usage.
# The scheduler uses exactly these parameters — no on-the-fly generation.
#
# VRAM budget notes:
#   Desktop + apps: ~4-5 GB (niri, LM Studio, Antigravity IDE, etc.)
#   Requirement: keep VRAM overhead graceful — ~3.5–4 GB free is fine,
#   hard OOM is not. The load_model retry handles VRAM fluctuations:
#     - Retries 'max' 3× with 5s delays (VRAM usage fluctuates)
#     - Falls through 0.90 → 0.85 → 0.75 GPU fractions before giving up
#     - gpu_fallback_cpu = true enables CPU fallback as a last resort
#       (very slow on 27B — only set if you need it)

[worker.cheap]
# Qwen3.5-9B Q4_K_M: ~5 GB model + ~2 GB KV (2 parallel) = ~7 GB
lms_model_key     = "qwen/qwen3.5-9b"
context_length    = 8192
parallel          = 2
gpu_offload       = "max"
max_output_tokens = 4096
default_timeout   = 300
# gpu_fallback_cpu = false  # (default) cheap model should always fit on GPU

[worker.smart]
# Qwen3.6-27B Q4_K_M: ~16.3 GB model + ~1 GB KV = ~17.3 GB
# The scheduler unloads the cheap model before loading this.
# With ~5 GB desktop overhead + 17.3 GB model = ~22.3 GB — fits with margin.
# Retry logic handles momentary VRAM spikes from other apps.
lms_model_key     = "qwen/qwen3.6-27b"
context_length    = 8192
parallel          = 1
gpu_offload       = "max"
max_output_tokens = 8192
default_timeout   = 600
# gpu_fallback_cpu = false  # Set to true if you want CPU fallback when GPU fully fails

[scheduler]
# Seconds to wait for additional cheap jobs before switching to smart mode.
cheap_drain_window = 5.0

# How often to poll LM Studio health (seconds).
health_check_interval = 30

# Days to retain completed/cancelled jobs in SQLite before pruning.
job_retention_days = 7
