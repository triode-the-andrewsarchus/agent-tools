# Pre-validated worker configurations for the RTX 3090 (24 GB VRAM).
#
# IMPORTANT: Only edit these values after testing VRAM usage.
# The scheduler uses exactly these parameters — no on-the-fly generation.
#
# Hardware & VRAM budget:
#   GPU: NVIDIA RTX 3090 (24 GB VRAM)
#   Desktop + apps overhead: ~4-5 GB (niri, LM Studio, Antigravity IDE, etc.)
#   Target headroom: ~3.5–4 GB free VRAM (graceful headroom, hard OOM avoided)
#   Execution policy: GPU only. No CPU fallback.
#   If a model cannot fit in GPU VRAM, a structured resource_error is returned
#   with available VRAM stats and actionable downgrade recommendations.

[worker.cheap]
# Qwen3.5-9B Q4_K_M: ~6.1 GB VRAM loaded at context_length=8192 (parallel=2)
# Fits comfortably alongside desktop apps with plenty of VRAM headroom.
# (Alternative downloaded variant: unsloth/qwen3.5-9b, Q4_K_S, ~6.7 GB VRAM)
lms_model_key     = "qwen/qwen3.5-9b"
context_length    = 8192
parallel          = 2
gpu_offload       = "max"
max_output_tokens = 4096
default_timeout   = 300

[worker.smart]
# Qwen3.6-27B Q4_K_M: ~16.3 GB model + KV cache
# The scheduler unloads the cheap model before loading this.
# When desktop overhead is low, fits at gpu=max. If VRAM is tight,
# the loader retries full GPU and steps down to high GPU fractions (0.90->0.85->0.75).
# If all GPU attempts fail, fails cleanly with resource_error and downgrade options.
lms_model_key     = "qwen/qwen3.6-27b"
context_length    = 8192
parallel          = 1
gpu_offload       = "max"
max_output_tokens = 8192
default_timeout   = 600

[scheduler]
# Seconds to wait for additional cheap jobs before switching to smart mode.
cheap_drain_window = 5.0

# How often to poll LM Studio health (seconds).
health_check_interval = 30

# Days to retain completed/cancelled jobs in SQLite before pruning.
job_retention_days = 7
