[project]
name = "pulpie-service"
version = "0.1.0"
description = "Fast local web-content extraction and preprocessing service using Pulpie for Antigravity"
requires-python = ">=3.12"
dependencies = [
    "pulpie>=0.0.2",
    "mcp[cli]>=2.2.0",
    "html2text>=2024.2.26",
    "trafilatura>=1.9.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
]

[project.scripts]
pulpie-mcp = "pulpie_service.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulpie_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
